# Снимок меню: забираем общее меню (одно на все филиалы) из Google-скрипта
# и кладём файлом menu/samal.json рядом с сайтом.
# Новый гость получает меню мгновенно с GitHub, а не ждёт Google 1–5 секунд.
# Свежесть не страдает: сайт сразу после показа сверяет меню с Google и
# докатывает изменения (стоп-лист, цены) живьём.
name: Снимок меню

on:
  schedule:
    # не на «круглые» минуты: в :00/:10 у GitHub очередь, плановые запуски теряются
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Забрать меню из Google-скрипта
        run: |
          API=$(grep -rhoE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' index.html assets 2>/dev/null | head -1)
          if [ -z "$API" ]; then echo "::error::не нашёл адрес скрипта"; exit 1; fi
          mkdir -p menu
          for b in samal; do
            if curl -sSfL --retry 3 --retry-delay 5 --max-time 60 "$API?action=getMenu&branch=$b" -o "/tmp/$b.json" \
              && jq -e '.status == "success" and (.categories | type == "object") and (.categories | length > 0)' "/tmp/$b.json" > /dev/null; then
              jq -c . "/tmp/$b.json" > "menu/$b.json"
            else
              echo "::warning::$b — меню не получено, оставляю прошлый снимок"
            fi
          done

      - name: Сохранить, если меню изменилось
        run: |
          git add menu
          if git diff --cached --quiet; then echo "меню не менялось"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Снимок меню"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
