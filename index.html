<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seven Times — Заявки кандидатов</title>
<style>
:root{
  --bg:#fbfbfd; --surface:#ffffff; --text:#1d1d1f; --muted:#86868b; --line:#e5e5e7;
  --accent:#7a1f2e; --accent-soft:#7a1f2e14; --good:#1a7d3c; --warn:#b8860b; --bad:#c23616;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.topbar{
  padding:16px 20px; display:flex; align-items:center; gap:16px;
  border-bottom:1px solid var(--line);
}
.brand{font-weight:600; font-size:15px; letter-spacing:-.01em;}
input[type=text]{
  font-size:16px; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--text); outline:none; font-family:inherit; width:100%;
}
input[type=text]:focus{ border-color:var(--accent); }
.btn{
  padding:12px 20px; border-radius:10px; border:none; cursor:pointer;
  font-size:15px; font-weight:600; font-family:inherit;
}
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:disabled{ background:#d1d1d6; cursor:not-allowed; }
.btn-ghost{ background:transparent; color:var(--text); border:1.5px solid var(--line); }
.gate{ max-width:360px; margin:100px auto; text-align:center; padding:0 20px; }
.gate h2{ font-size:22px; margin-bottom:8px; }
.gate p{ color:var(--muted); font-size:14px; margin-bottom:20px; }
.gate input{ text-align:center; margin-bottom:14px; }
.err{ color:var(--bad); font-size:13px; margin-top:10px; display:none; }
.err.show{ display:block; }
.admin-wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; display:none; }
.admin-wrap.show{ display:block; }
.admin-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px; }
.admin-title{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
.admin-sub{ color:var(--muted); font-size:14px; margin-top:4px; }
.stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:26px; }
.stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
.stat-card .n{ font-size:24px; font-weight:700; letter-spacing:-.02em; }
.stat-card .l{ font-size:13px; color:var(--muted); margin-top:2px; }
.filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.fchip{ padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); }
.fchip.active{ background:var(--text); color:#fff; border-color:var(--text); }
.table-wrap{ background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:800px; }
th{ text-align:left; padding:13px 15px; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); background:#fafafa; }
td{ padding:13px 15px; border-bottom:1px solid var(--line); vertical-align:top; }
tr:last-child td{ border-bottom:none; }
tr.row-detail{ cursor:pointer; }
tr.row-detail:hover{ background:#fafafa; }
.score-badge{ display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:12px; white-space:nowrap; }
.score-good{ background:#1a7d3c1a; color:var(--good); }
.score-warn{ background:#b8860b1a; color:var(--warn); }
.score-bad{ background:#c236161a; color:var(--bad); }
.detail-row{ display:none; background:#fafafa; }
.detail-row.open{ display:table-row; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; padding:6px 0; }
.detail-grid .k{ color:var(--muted); font-size:12px; }
.detail-grid .v{ font-size:14px; margin-top:2px; }
.empty{ text-align:center; padding:60px 20px; color:var(--muted); }
.loading{ text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Seven Times · HR</div>
</div>

<div class="gate" id="adminGate">
  <h2>Доступ к анкетам</h2>
  <p>Введите пароль отдела кадров</p>
  <input type="text" id="adminPass" placeholder="Пароль">
  <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Войти</button>
  <div class="err" id="adminErr">Неверный пароль</div>
</div>

<div class="admin-wrap" id="adminPanel">
  <div class="admin-top">
    <div>
      <div class="admin-title">Заявки кандидатов</div>
      <div class="admin-sub" id="adminSub">—</div>
      <div class="admin-sub" id="adminWho" style="color:var(--accent); font-weight:600;"></div>
      <div id="hrOnlineIndicator" style="display:none;margin-top:6px;font-size:13px;color:var(--good);font-weight:600"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost" onclick="hrChatOpen()" style="position:relative">
        Чат
        <span id="hrChatBadge" style="display:none;position:absolute;top:-6px;right:-6px;width:9px;height:9px;border-radius:50%;background:var(--bad)"></span>
      </button>
      <button class="btn btn-ghost" onclick="loadApplications()">Обновить</button>
      <button class="btn btn-ghost" onclick="hrLogout()">Выйти</button>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>
  <div class="filters" id="filters"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Имя</th><th>Должность</th><th>Возраст</th><th>Опыт</th>
          <th>Подходит нам</th><th>Статус</th><th>Обработал(а)</th><th>Дата</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="8" class="loading">Загрузка…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
/* Вставь сюда URL деплоя того же Apps Script, что и у основного сайта меню —
   анкеты вакансий (лист "Вакансия") пишутся именно туда */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjh2SWvRtAPhg2liGPHApixlNWmO7QO51pgncJDrUkbJgfdGKaW2dwAr_-fRtuifRi9Q/exec";

let ALL_APPS = [];
let ACTIVE_FILTER = 'all';

function adminLogin(){
  const pass = document.getElementById('adminPass').value;
  if(!pass) return;
  document.getElementById('adminErr').classList.remove('show');
  tryLoadWithKey(pass, false);
}

async function tryLoadWithKey(key, silent){
  const btn = document.querySelector('#adminGate button');
  if(!silent && btn) btn.textContent = 'Проверяем…';
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok){
      sessionStorage.setItem('st_hr_admin_key', key);
      sessionStorage.setItem('st_hr_admin_name', data.adminName || '');
      ALL_APPS = data.rows || [];
      showAdminPanel();
    } else {
      sessionStorage.removeItem('st_hr_admin_key');
      sessionStorage.removeItem('st_hr_admin_name');
      if(!silent) document.getElementById('adminErr').classList.add('show');
    }
  }catch(err){
    if(!silent) document.getElementById('adminErr').classList.add('show');
  } finally {
    if(btn) btn.textContent = 'Войти';
  }
}

function showAdminPanel(){
  document.getElementById('adminGate').style.display = 'none';
  document.getElementById('adminPanel').classList.add('show');
  const name = sessionStorage.getItem('st_hr_admin_name') || '';
  document.getElementById('adminWho').textContent = name ? `Вы вошли как: ${name}` : '';
  renderAdminStats();
  renderFilters();
  renderTable();
  hrStartPresenceAndChat();
  clearInterval(hrAppsRefreshTimer);
  hrAppsRefreshTimer = setInterval(hrSilentRefreshApplications, 1000);
}

// ── "В СЕТИ" — раз в 20 сек сообщаем о себе, узнаём кто ещё активен ──
let hrPresenceTimer = null;
let hrChatPollTimer = null;
let hrAppsRefreshTimer = null;
let hrChatMessages = [];

function hrLogout(){
  sessionStorage.removeItem('st_hr_admin_key');
  sessionStorage.removeItem('st_hr_admin_name');
  clearInterval(hrPresenceTimer);
  clearInterval(hrChatPollTimer);
  clearInterval(hrAppsRefreshTimer);
  document.getElementById('adminPanel').classList.remove('show');
  document.getElementById('adminGate').style.display = 'block';
  document.getElementById('adminPass').value = '';
}

function hrStartPresenceAndChat(){
  hrPing();
  clearInterval(hrPresenceTimer);
  hrPresenceTimer = setInterval(hrPing, 20000);
  hrChatFetch();
  clearInterval(hrChatPollTimer);
  hrChatPollTimer = setInterval(hrChatFetch, 500);
}

async function hrPing(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrPing&key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok){
      const el = document.getElementById('hrOnlineIndicator');
      if(data.othersOnline && data.othersOnline.length){
        el.style.display = 'block';
        el.textContent = '🟢 В сети: ' + data.othersOnline.join(', ');
      } else {
        el.style.display = 'none';
      }
    }
  }catch(err){}
}

async function hrChatFetch(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrChatList&key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok){
      const isNewMsgs = data.messages.length > hrChatMessages.length;
      hrChatMessages = data.messages || [];
      hrRenderChat();
      const ov = document.getElementById('hrChatOv');
      const myName = sessionStorage.getItem('st_hr_admin_name') || '';
      const lastMsg = hrChatMessages[hrChatMessages.length - 1];
      if(isNewMsgs && lastMsg && lastMsg.sender !== myName && (!ov || ov.style.display !== 'block')){
        document.getElementById('hrChatBadge').style.display = 'block';
      }
    }
  }catch(err){}
}

function hrRenderChat(){
  const myName = sessionStorage.getItem('st_hr_admin_name') || '';
  const box = document.getElementById('hrChatMessages');
  if(!box) return;
  box.innerHTML = hrChatMessages.map(m => {
    const mine = m.sender === myName;
    const time = m.time ? new Date(m.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:80%">
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px;${mine?'text-align:right':''}">${m.sender} · ${time}</div>
      <div style="padding:9px 13px;border-radius:14px;background:${mine?'var(--accent)':'#f0f0f0'};color:${mine?'#fff':'var(--text)'};font-size:14px;line-height:1.4">${m.text}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function hrChatOpen(){
  document.getElementById('hrChatOv').style.display = 'block';
  document.getElementById('hrChatBadge').style.display = 'none';
}

function hrChatClose(){
  document.getElementById('hrChatOv').style.display = 'none';
}

async function hrChatSend(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  const myName = sessionStorage.getItem('st_hr_admin_name') || '';
  const input = document.getElementById('hrChatInput');
  const text = input.value.trim();
  if(!text || !key) return;
  input.value = '';

  // сразу показываем своё сообщение, не дожидаясь ответа сервера
  hrChatMessages.push({ time: new Date().toISOString(), sender: myName, text: text });
  hrRenderChat();

  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action:'hrChatSend', key, text })
    });
    hrChatFetch();
  }catch(err){
    console.error('Не удалось отправить сообщение', err);
  }
}

async function loadApplications(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="loading">Загрузка…</td></tr>`;
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    const data = await res.json();
    ALL_APPS = data.rows || [];
    renderAdminStats();
    renderFilters();
    renderTable();
  }catch(err){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="empty">Не удалось загрузить данные. Проверь SCRIPT_URL.</td></tr>`;
  }
}

// Тихое автообновление списка анкет — раз в секунду, без мигания "Загрузка…"
async function hrSilentRefreshApplications(){
  const key = sessionStorage.getItem('st_hr_admin_key');
  if(!key) return;
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrList&key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.ok === false) return;
    const freshRows = data.rows || [];
    // Сливаем, а не заменяем целиком — иначе только что показанный результат
    // ИИ-анализа (он живёт только в браузере, на сервере хранится лишь балл)
    // стирался бы каждую секунду вместе со всем остальным списком.
    const oldById = {};
    ALL_APPS.forEach(a => { if(a.aiVerdict) oldById[a.id] = a.aiVerdict; });
    freshRows.forEach(a => { if(oldById[a.id]) a.aiVerdict = oldById[a.id]; });
    ALL_APPS = freshRows;
    renderAdminStats();
    renderFilters();
    renderTable();
  }catch(err){}
}

const STATUSES = ["Новая", "Позвонили", "Собеседование назначено", "Принят(а)", "Отказ"];

let hrEditingId = null;

function hrOpenStatusEditor(id){
  const a = ALL_APPS.find(x=>x.id===id);
  if(!a) return;
  hrEditingId = id;
  document.getElementById('hrStatusName').textContent = a.name || '—';
  const sel = document.getElementById('hrStatusSelect');
  const currentIdx = STATUSES.indexOf(a.status || 'Новая');
  const options = STATUSES.filter(s => s !== 'Новая');
  const firstOpenIdx = options.findIndex(s => STATUSES.indexOf(s) > currentIdx || s === 'Отказ');
  sel.innerHTML = options.map((s, i)=>{
    const idx = STATUSES.indexOf(s);
    const isDone = idx <= currentIdx && s !== 'Отказ'; // включая текущий статус — его тоже нельзя выбрать повторно
    const isFirstOpen = i === firstOpenIdx && !isDone;
    return `<option value="${s}" ${isFirstOpen?'selected':''} ${isDone?'disabled':''}>${s}${isDone?' (уже выполнено)':''}</option>`;
  }).join('');
  document.getElementById('hrInterviewYearLabel').textContent = 'Дата и время собеседования (' + new Date().getFullYear() + ' год)';
  hrBuildInterviewPickers(a);
  hrStatusSelectChange();
  document.getElementById('hrStatusOv').style.display = 'flex';
}

function hrCloseStatusEditor(){
  document.getElementById('hrStatusOv').style.display = 'none';
  hrEditingId = null;
}

// Год и месяц зафиксированы (текущий месяц, текущий год) — выбирать нужно
// только день (от сегодняшнего числа до конца месяца) и час, никаких лишних кликов.
function hrBuildInterviewPickers(a){
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const daySel = document.getElementById('hrInterviewDay');
  let dayOpts = '';
  for(let d=now.getDate(); d<=daysInMonth; d++){
    dayOpts += `<option value="${d}">${String(d).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}</option>`;
  }
  daySel.innerHTML = dayOpts;
  if(a.interviewDate){
    const dayNum = parseInt(a.interviewDate);
    if(dayNum) daySel.value = dayNum;
  }

  const hourSel = document.getElementById('hrInterviewHour');
  let hourOpts = '';
  for(let h=9; h<=21; h++){
    hourOpts += `<option value="${String(h).padStart(2,'0')}:00">${String(h).padStart(2,'0')}:00</option>`;
  }
  hourSel.innerHTML = hourOpts;
  if(a.interviewTime) hourSel.value = a.interviewTime;
}

function hrStatusSelectChange(){
  const val = document.getElementById('hrStatusSelect').value;
  document.getElementById('hrInterviewFields').style.display = (val === 'Собеседование назначено') ? 'block' : 'none';
}

async function hrSaveStatus(){
  if(!hrEditingId) return;
  const key = sessionStorage.getItem('st_hr_admin_key');
  const adminName = sessionStorage.getItem('st_hr_admin_name') || '';
  const newStatus = document.getElementById('hrStatusSelect').value;
  let interviewDate = '', interviewTime = '';
  if(newStatus === 'Собеседование назначено'){
    const daySel = document.getElementById('hrInterviewDay');
    const now = new Date();
    interviewDate = daySel.value ? (String(daySel.value).padStart(2,'0') + '.' + String(now.getMonth()+1).padStart(2,'0')) : '';
    interviewTime = document.getElementById('hrInterviewHour').value || '';
  }
  const btn = document.getElementById('hrStatusSaveBtn');
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action:'hrUpdateStatus', key, id:hrEditingId, status:newStatus, adminName, interviewDate, interviewTime })
    });
    const data = await res.json();
    if(data.ok){
      const item = ALL_APPS.find(a=>a.id===hrEditingId);
      if(item){
        item.status = newStatus;
        item.processedBy = adminName;
        item.statusChangedAt = new Date().toISOString();
        if(interviewDate) item.interviewDate = interviewDate;
        if(interviewTime) item.interviewTime = interviewTime;
      }
      renderTable();
      hrCloseStatusEditor();
    }
  }catch(err){
    console.error('Не удалось обновить статус', err);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
}

function renderAdminStats(){
  const total = ALL_APPS.length;
  const strong = ALL_APPS.filter(a=>Number(a.score)>=70).length;
  const avg = total ? Math.round(ALL_APPS.reduce((s,a)=>s+Number(a.score||0),0)/total) : 0;
  document.getElementById('adminSub').textContent = `Всего заявок: ${total}`;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="n">${total}</div><div class="l">Всего заявок</div></div>
    <div class="stat-card"><div class="n">${strong}</div><div class="l">Сильных кандидатов (70%+)</div></div>
    <div class="stat-card"><div class="n">${avg}%</div><div class="l">Средний балл</div></div>
  `;
}

function renderFilters(){
  const positions = ['all', ...new Set(ALL_APPS.map(a=>a.position).filter(Boolean))];
  document.getElementById('filters').innerHTML = positions.map(p=>`
    <div class="fchip ${ACTIVE_FILTER===p?'active':''}" onclick="setFilter('${p.replace(/'/g,"\\'")}')">${p==='all'?'Все должности':p}</div>
  `).join('');
}

function setFilter(p){ ACTIVE_FILTER = p; renderFilters(); renderTable(); }

function scoreClass(s){ s=Number(s); return s>=70?'score-good':(s>=40?'score-warn':'score-bad'); }

function renderTable(){
  let rows = ACTIVE_FILTER==='all' ? ALL_APPS : ALL_APPS.filter(a=>a.position===ACTIVE_FILTER);
  rows = rows.slice().sort((a,b)=>Number(b.score||0)-Number(a.score||0));
  if(!rows.length){
    document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="empty">Заявок пока нет</td></tr>`;
    return;
  }
  document.getElementById('tbody').innerHTML = rows.map((a,i)=>`
    <tr class="row-detail" onclick="toggleDetail(${i}, '${a.id}')">
      <td><b>${a.name||'—'}</b>${a.ageFlag ? `<div style="margin-top:4px;"><span class="score-badge score-warn" title="${a.ageFlag}">до 18 лет</span></div>` : ''}</td>
      <td>${a.position||'—'}</td>
      <td>${a.age||'—'}</td>
      <td>${a.experience||'—'}</td>
      <td><span class="score-badge ${scoreClass(a.score)}">${a.score||0}%</span></td>
      <td onclick="event.stopPropagation()">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px">${a.status||'Новая'}</div>
        ${a.processedBy ? `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">${a.processedBy}${a.statusChangedAt ? ', ' + new Date(a.statusChangedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</div>` : ''}
        ${a.status === 'Собеседование назначено' && a.interviewDate ? `<div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px">${a.interviewDate}${a.interviewTime ? ', ' + a.interviewTime : ''}</div>` : ''}
        <button onclick="hrOpenStatusEditor('${a.id}')" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--accent);font-weight:600;font-family:inherit">Изменить</button>
      </td>
      <td>${a.processedBy || '—'}</td>
      <td>${a.timestamp ? new Date(a.timestamp).toLocaleDateString('ru-RU') : '—'}</td>
    </tr>
    <tr class="detail-row" id="detail-${i}">
      <td colspan="8">
        <div id="hrPsychBlock-${i}" style="margin-bottom:16px"></div>
        <div class="detail-grid">
          <div><div class="k">Телефон</div><div class="v">${a.phone||'—'}</div></div>
          <div><div class="k">Ответ на вопрос по должности</div><div class="v">${a.roleAnswer||'—'}</div></div>
          <div><div class="k">Учится</div><div class="v">${a.isStudent||'—'}</div></div>
          <div><div class="k">Подработка параллельно</div><div class="v">${a.parallelJob||'—'}</div></div>
          <div><div class="k">Предыдущее место работы</div><div class="v">${a.prevPlace||'—'}</div></div>
          <div><div class="k">Причина увольнения</div><div class="v">${a.leaveReason||'—'}</div></div>

function hrScoreTrait(text) {
  if (!text || !text.trim()) return null;
  const lower = text.toLowerCase().trim();
  const harshWords = ['похуй','пофиг','плевать','насрать','наплевать','забью','похер'];
  const dismissiveWords = ['не буду','уйду','ничего не сдела','ничего не буду','нет','не знаю','промолчу','никто не узнает','сойдёт','откажу','нагруб','разозл','пошлю'];
  return function(cfg) {
    let s = 50;
    // грубая/безразличная отписка — сразу низкий балл, независимо от остального
    if (harshWords.some(w => lower.includes(w))) return 5;
    const hasPositive = cfg.pos.some(w => lower.includes(w));
    cfg.pos.forEach(w => { if (lower.includes(w)) s += 9; });
    cfg.neg.forEach(w => { if (lower.includes(w)) s -= 15; });
    dismissiveWords.forEach(w => { if (lower.includes(w)) s -= 12; });
    if (lower.length > 60) s += 10;
    else if (lower.length > 30) s += 5;
    else if (lower.length < 10 && !hasPositive) s -= 15;
    return Math.max(4, Math.min(97, Math.round(s)));
  };
}

function hrRenderAiVerdictHtml(v){

async function hrRunAiAnalysis(id, btn){
  const key = sessionStorage.getItem('st_hr_admin_key');
  const resultBox = document.getElementById('hrAiResult-' + id);
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Думаю…';
  resultBox.style.display = 'block';
  resultBox.innerHTML = '<div style="font-size:12px;color:var(--muted)">ИИ читает ответы кандидата…</div>';
  try{
    const res = await fetch(SCRIPT_URL + '?action=hrAiAnalyze&key=' + encodeURIComponent(key) + '&id=' + encodeURIComponent(id));
    const data = await res.json();
    if(!data.ok){
      resultBox.innerHTML = '<div style="font-size:12px;color:var(--bad)">Не удалось получить анализ: ' + (data.msg || 'ошибка') + '</div>';
      return;
    }
    const r = data.result;
    const traits = [
      { label: 'Стрессоустойчивость', val: r.stress },
      { label: 'Полная занятость', val: r.commitment },
      { label: 'Пунктуальность', val: r.punctuality },
      { label: 'Вежливость', val: r.politeness },
      { label: 'Ответственность', val: r.responsibility }
    ];
    const avg = Math.round(traits.reduce((s,t)=>s+Number(t.val||0),0) / traits.length);
    resultBox.innerHTML = hrRenderAiVerdictHtml({ traits, avg, verdict: r.verdict });
    // Балл от ИИ теперь официальный — сохраняем в данные кандидата (переживёт
    // перерисовку при сортировке) и обновляем список/статистику
    const appIdx = ALL_APPS.findIndex(x => x.id === id);
    if (appIdx !== -1) {
      ALL_APPS[appIdx].score = data.score;
      ALL_APPS[appIdx].aiVerdict = { traits, avg, verdict: r.verdict };
    }
    renderAdminStats();
    renderTable();
  }catch(err){
    resultBox.innerHTML = '<div style="font-size:12px;color:var(--bad)">Ошибка запроса: ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

function hrBarColor(pct) {
  if (pct >= 65) return 'var(--good)';
  if (pct >= 40) return 'var(--warn)';
  return 'var(--bad)';
}

function hrRenderPsychAnalysis(a) {
  const roleQs = HR_ROLE_PSYCH_QUESTIONS[a.position] || {};
  const items = HR_TRAITS.map(t => {
    const text = a[t.key] || '';
    const scorer = hrScoreTrait(text);
    const pct = scorer ? scorer(t) : null;
    return { label: t.label, question: roleQs[t.key] || '', text: text, pct: pct };
  });
  const overall = a.score !== undefined && a.score !== '' ? Number(a.score) : null;

  return `
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:4px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-weight:700;font-size:14px">Психологический анализ</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${overall !== null ? `<span class="score-badge ${overall>=65?'score-good':overall>=40?'score-warn':'score-bad'}">Подходит нам: ${overall}%</span>` : ''}
          <button onclick="hrRunAiAnalysis('${a.id}', this)" style="font-size:11px;padding:6px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap">✨ ИИ-анализ</button>
        </div>
      </div>
      <div id="hrAiResult-${a.id}" style="${a.aiVerdict ? '' : 'display:none;'}margin-bottom:12px">${a.aiVerdict ? hrRenderAiVerdictHtml(a.aiVerdict) : ''}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Общий процент считается по всей анкете (опыт, причина ухода и т.д.) — шкалы ниже показывают только 5 психологических ответов по отдельности.</div>
      ${items.map(x => `
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px">
            <span>${x.label}</span><span>${x.pct !== null ? x.pct + '%' : '—'}</span>
          </div>
          ${x.question ? `<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px">${x.question}</div>` : ''}
          <div style="height:6px;background:#eee;border-radius:4px;overflow:hidden;margin-bottom:6px">
            <div style="height:100%;width:${x.pct !== null ? x.pct : 0}%;background:${x.pct !== null ? hrBarColor(x.pct) : '#ddd'};border-radius:4px"></div>
          </div>
          <div style="font-size:12px;color:var(--text);line-height:1.5">${x.text || '—'}</div>
        </div>
      `).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Шкалы по каждому качеству — автоматическая оценка по ключевым словам в ответе, читайте текст рядом.</div>
    </div>
  `;
}
